<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8c00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6600;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Headphone band -->
  <path d="M 16 32 Q 16 12, 32 12 Q 48 12, 48 32" 
        stroke="url(#orangeGradient)" 
        stroke-width="4" 
        fill="none" 
        stroke-linecap="round"/>
  
  <!-- Left ear cup -->
  <rect x="12" y="30" width="10" height="16" rx="3" fill="url(#orangeGradient)"/>
  <rect x="14" y="32" width="6" height="12" rx="2" fill="#fff" opacity="0.3"/>
  
  <!-- Right ear cup -->
  <rect x="42" y="30" width="10" height="16" rx="3" fill="url(#orangeGradient)"/>
  <rect x="44" y="32" width="6" height="12" rx="2" fill="#fff" opacity="0.3"/>
  
  <!-- Adjustment details -->
  <line x1="20" y1="16" x2="24" y2="16" stroke="#ff6600" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="14" x2="32" y2="14" stroke="#ff6600" stroke-width="2" stroke-linecap="round"/>
  <line x1="36" y1="14" x2="40" y2="14" stroke="#ff6600" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="16" x2="44" y2="16" stroke="#ff6600" stroke-width="2" stroke-linecap="round"/>
</svg>